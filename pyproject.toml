[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-to-cold"
version = "0.1.0"
description = "Solar-powered smart mini cold storage system using physics-based simulation and NSGA-II optimization."
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
heat-to-cold = "heat_to_cold.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: expensive end-to-end optimization regression tests",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
